# Local full-stack run: `cp .env.example .env`, set JWT_SIGNING_KEY, then `docker compose up --build`.
# The web app is served on http://localhost:8080.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: restaurantos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurantos}
      POSTGRES_DB: restaurantos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurantos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=restaurantos;Username=restaurantos;Password=${POSTGRES_PASSWORD:-restaurantos}
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (at least 32 random characters)}
      Cors__Origins__0: http://localhost:8080
      Integrations__MockPaymentWebhookSecret: ${MOCK_PAYMENT_WEBHOOK_SECRET:-}
      Integrations__EnableMockSimulators: ${ENABLE_MOCK_SIMULATORS:-false}

  web:
    build: ./frontend
    depends_on: [api]
    ports:
      - "8080:80"

volumes:
  pgdata:
